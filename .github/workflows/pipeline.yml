name: FX-Core CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Run Tests
      run: mvn clean verify

  docker-package:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup Buildx is the standard for modern Docker builds
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # This replaces the failed 'setup-docker-action'
    - name: Build Docker Image
      run: |
        docker build -t fx-core:${{ github.sha }} .
        docker tag fx-core:${{ github.sha }} fx-core:latest
